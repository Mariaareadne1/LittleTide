name: LittleTide
options:
  bundleIdPrefix: app.littletide
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
packages:
  TideKit:
    path: Packages/TideKit
targets:
  LittleTide:
    type: application
    platform: iOS
    sources:
      - path: LittleTide
    dependencies:
      - package: TideKit
        product: TideKit
      - package: TideKit
        product: TideUI
      - target: LittleTideWidgets
        embed: true
        codeSign: true
    entitlements:
      path: LittleTide/LittleTide.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.littletide.shared
    info:
      path: LittleTide/Info.plist
      properties:
        CFBundleDisplayName: Little Tide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.weather
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: app.littletide.LittleTide
            CFBundleURLSchemes:
              - littletide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.littletide.LittleTide
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  LittleTideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LittleTideWidgets
    dependencies:
      - package: TideKit
        product: TideKit
      - package: TideKit
        product: TideUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: LittleTideWidgets/LittleTideWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.littletide.shared
    info:
      path: LittleTideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Little Tide
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.littletide.LittleTide.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LittleTideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LittleTideTests
    dependencies:
      - target: LittleTide
      - package: TideKit
        product: TideKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.littletide.LittleTideTests
        GENERATE_INFOPLIST_FILE: YES
  LittleTideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LittleTideUITests
    dependencies:
      - target: LittleTide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.littletide.LittleTideUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LittleTide
schemes:
  LittleTide:
    build:
      targets:
        LittleTide: all
        LittleTideWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LittleTide
      targets:
        - LittleTideTests
        - LittleTideUITests
        - package: TideKit/TideKitTests
    archive:
      config: Release
  LittleTideWidgets:
    build:
      targets:
        LittleTideWidgets: all
        LittleTide: all
    run:
      config: Debug
      askForAppToLaunch: true
